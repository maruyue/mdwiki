<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>mdwiki-demo</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    --bg: #1e1e1e; --bg2: #252526; --bg3: #2d2d2d;
    --border: #333; --border2: #3e3e42;
    --fg: #cccccc; --fg-strong: #e8e8e8; --fg-dim: #8a8a8a;
    --accent: #7ec699; --btn: #3c3c3c; --btn-hover: #505050;
    --link: #4daafc; --code-bg: #2b2b2b; --pre-bg: #1a1a1a;
    --quote-border: #4b4b52; --quote-fg: #9a9a9a; --th-bg: #252526;
    --scroll: #424242; --scroll-hover: #4f4f4f; --active: #37373d;
  }
  body.light {
    --bg: #ffffff; --bg2: #f8f8f8; --bg3: #e8e8e8;
    --border: #e2e2e2; --border2: #dcdcdc;
    --fg: #333333; --fg-strong: #1a1a1a; --fg-dim: #888888;
    --accent: #0a7d47; --btn: #e6e6e6; --btn-hover: #d8d8d8;
    --link: #0451a5; --code-bg: #f1f1f1; --pre-bg: #f8f8f8;
    --quote-border: #c8c8c8; --quote-fg: #666666; --th-bg: #f0f0f0;
    --scroll: #c1c1c1; --scroll-hover: #adadad; --active: #e2e2e2;
  }
  body { font-family: -apple-system, "PingFang SC", sans-serif; height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--fg); }
  body.light { color-scheme: light; }
  header { display: flex; align-items: center; gap: 12px; padding: 8px 14px; background: var(--bg2); border-bottom: 1px solid var(--border); }
  header h1 { font-size: 15px; color: var(--accent); margin-right: 8px; }
  header button { background: var(--btn); color: var(--fg); border: 1px solid var(--border2); padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; }
  header button:hover { background: var(--btn-hover); }
  #cur-file { color: var(--fg-dim); font-size: 13px; }
  #online { margin-left: auto; font-size: 12px; }
  .badge { border: 1px solid; border-radius: 8px; padding: 1px 8px; margin-left: 4px; }
  main { flex: 1; display: flex; overflow: hidden; }
  #sidebar { width: 190px; background: var(--bg2); border-right: 1px solid var(--border); padding-top: 8px; overflow-y: auto; flex-shrink: 0; }
  #sidebar a { display: block; padding: 7px 8px 7px 4px; color: var(--fg); text-decoration: none; font-size: 13px; border-left: none; }
  #sidebar a:hover { background: var(--bg3); }
  #sidebar a.active { background: var(--active); color: var(--fg-strong); border-left-color: var(--accent); }
  #sidebar .dir { color: var(--fg-dim); font-size: 12px; padding: 5px 10px; cursor: pointer; user-select: none; }
  #sidebar .dir:hover { color: var(--fg); background: var(--bg3); }
  .tree-row { display: flex; align-items: center; position: relative; }
  .tree-row a { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 5px; }
  .tree-row a svg { width: 12px; height: 12px; flex-shrink: 0; color: var(--fg-dim); }
  .tree-label { display: inline-flex; align-items: center; gap: 4px; }
  .tree-label .chev { width: 10px; display: inline-block; color: var(--fg-dim); font-size: 9px; }
  .tree-label .chev-placeholder { width: 10px; display: inline-block; }
  .tree-label svg { width: 12px; height: 12px; color: #dcb67a; }
  body.light .tree-label svg { color: #b8860b; }
  .f-json, .f-yaml, .f-yml, .f-js, .f-ts, .f-py, .f-css, .f-html, .f-sh { color: var(--link); }
  .tree-row.active { background: var(--active); }
  .tree-row.active a { color: var(--fg-strong); border-left-color: var(--accent); }
  .row-menu-btn { display: none; position: absolute; right: 6px; background: var(--bg2); border: none; color: var(--fg-dim); cursor: pointer; padding: 2px 4px; border-radius: 4px; }
  .row-move svg { width: 11px; height: 11px; display: block; }
  .tree-row:hover .row-menu-btn { display: block; }
  .row-menu-btn:hover { color: var(--link); }
  #editor, #preview { flex: 1; overflow: auto; }
  #editor-col { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #toolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 1px; padding: 4px 8px; background: var(--bg2); border-bottom: 1px solid var(--border); }
  #toolbar button { background: none; border: none; color: var(--link); padding: 3px 7px; border-radius: 4px; cursor: pointer; font-size: 13px; line-height: 1.3; display: inline-flex; align-items: center; gap: 1px; }
  #toolbar button:hover { background: var(--active); }
  #toolbar button svg { display: block; }
  #toolbar button .h-lvl { font-size: 9px; color: var(--fg-dim); margin-left: -2px; }
  #toolbar .tb-label { margin-left: 4px; font-size: 12px; }
  #fmt-status { margin-left: 10px; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 55%; }
  #fmt-status.fmt-ok { color: #3db86a; }
  #fmt-status.fmt-err { color: #e0533d; }
  #toolbar .tb-sep { width: 1px; height: 18px; background: var(--border2); margin: 0 5px; }
  #editor { flex: 1; }
  #conn-banner { display: none; padding: 5px 12px; background: #5a1d1d; color: #ffb4b4; font-size: 12px; border-bottom: 1px solid #7a2a2a; }
  body.light #conn-banner { background: #ffe8e8; color: #a31515; border-bottom-color: #f0c0c0; }
  #editor-col.locked #editor { opacity: .55; }
  #editor-col.locked #toolbar { opacity: .55; }
  #editor .cm-editor { height: 100%; }
  #editor .cm-editor .cm-scroller { overflow: auto; }
  #preview { padding: 30px 40px; border-left: 1px solid var(--border); font-size: 15px; line-height: 1.75; color: var(--fg); max-width: 52rem; overflow-y: auto; }
  #preview > *:first-child { margin-top: 0; }
  #preview h1 { font-size: 1.75em; color: var(--fg-strong); margin: 1em 0 0.5em; padding-bottom: 0.3em; border-bottom: 1px solid var(--border2); }
  #preview h2 { font-size: 1.4em; color: var(--fg-strong); margin: 1em 0 0.5em; padding-bottom: 0.25em; border-bottom: 1px solid var(--border2); }
  #preview h3 { font-size: 1.18em; color: var(--fg-strong); margin: 1em 0 0.4em; }
  #preview h4, #preview h5, #preview h6 { color: var(--fg-strong); margin: 0.9em 0 0.4em; }
  #preview p { margin: 0.6em 0; }
  #preview a { color: var(--link); text-decoration: none; }
  #preview a:hover { text-decoration: underline; }
  #preview code { background: var(--code-bg); border-radius: 4px; padding: 2px 6px; font-size: 0.87em; font-family: "SF Mono", Menlo, Consolas, monospace; color: #ce9178; }
  body.light #preview code { color: #a31515; }
  #preview pre { background: var(--pre-bg); border: 1px solid var(--border); border-radius: 8px; padding: 13px 16px; overflow: auto; margin: 0.9em 0; }
  #preview pre code { background: none; padding: 0; color: var(--fg); font-size: 0.87em; }
  #preview blockquote { border-left: 4px solid var(--quote-border); background: rgba(128,128,128,0.06); padding: 6px 16px; margin: 0.8em 0; border-radius: 0 6px 6px 0; color: var(--quote-fg); }
  #preview table { border-collapse: collapse; margin: 0.9em 0; font-size: 0.95em; }
  #preview th, #preview td { border: 1px solid var(--border2); padding: 6px 13px; }
  #preview th { background: var(--th-bg); color: var(--fg-strong); }
  #preview ul, #preview ol { padding-left: 1.7em; margin: 0.5em 0; }
  #preview li { margin: 0.28em 0; }
  #preview hr { border: none; border-top: 1px solid var(--border2); margin: 1.5em 0; }
  #preview img { max-width: 100%; border-radius: 6px; }
  #preview input[type="checkbox"] { accent-color: var(--link); margin-right: 4px; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 5px; border: 2px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background: var(--scroll-hover); background-clip: content-box; border: 2px solid transparent; }
  ::-webkit-scrollbar-track { background: transparent; }
  /* highlight.js 预览代码高亮(GitHub Dark / Light 双色板) */
  .hljs-comment, .hljs-quote { color: #8b949e; font-style: italic; }
  .hljs-keyword, .hljs-selector-tag, .hljs-deletion { color: #ff7b72; }
  .hljs-string, .hljs-doctag, .hljs-regexp, .hljs-addition { color: #a5d6ff; }
  .hljs-number, .hljs-literal, .hljs-attr, .hljs-attribute { color: #79c0ff; }
  .hljs-title, .hljs-title.function_, .hljs-section, .hljs-name { color: #d2a8ff; }
  .hljs-type, .hljs-class .hljs-title, .hljs-title.class_, .hljs-built_in { color: #ffa657; }
  .hljs-meta, .hljs-symbol, .hljs-bullet, .hljs-link { color: #79c0ff; }
  .hljs-emphasis { font-style: italic; }
  .hljs-strong { font-weight: 700; }
  body.light .hljs-comment, body.light .hljs-quote { color: #6e7781; }
  body.light .hljs-keyword, body.light .hljs-selector-tag, body.light .hljs-deletion { color: #cf222e; }
  body.light .hljs-string, body.light .hljs-doctag, body.light .hljs-regexp, body.light .hljs-addition { color: #0a3069; }
  body.light .hljs-number, body.light .hljs-literal, body.light .hljs-attr, body.light .hljs-attribute { color: #0550ae; }
  body.light .hljs-title, body.light .hljs-title.function_, body.light .hljs-section, body.light .hljs-name { color: #8250df; }
  body.light .hljs-type, body.light .hljs-class .hljs-title, body.light .hljs-title.class_, body.light .hljs-built_in { color: #953800; }
  body.light .hljs-meta, body.light .hljs-symbol, body.light .hljs-bullet, body.light .hljs-link { color: #0550ae; }
  #note-menu { position: fixed; z-index: 1000; width: 240px; background: var(--bg2); border: 1px solid var(--border2); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.35); padding: 6px; }
  #note-menu input { width: 100%; padding: 5px 8px; border: 1px solid var(--border2); border-radius: 5px; background: var(--bg); color: var(--fg); font-size: 13px; outline: none; margin-bottom: 4px; }
  #note-menu .note-menu-list { max-height: 260px; overflow-y: auto; }
  #note-menu .note-menu-item { padding: 6px 10px; border-radius: 5px; font-size: 13px; color: var(--fg); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #note-menu .note-menu-item:hover { background: var(--active); color: var(--fg-strong); }
  #note-menu .note-menu-empty { padding: 10px; color: var(--fg-dim); font-size: 12px; text-align: center; }
  #note-menu .note-menu-item svg { width: 11px; height: 11px; margin-right: 6px; }
  #note-menu .menu-danger { color: #e0533d; }
  #note-menu .menu-danger:hover { background: #5a1d1d; color: #ff8f80; }
  #editor .cm-foldGutter { display: none !important; } /* 去掉折叠小箭头列(CM 运行时样式序在后,必须 important) */
  .cm-ySelectionInfo { opacity: 1 !important; } /* 协作者名字标签常显 */
</style>
</head>
<body class="dark">
<header>
  <h1>mdwiki-demo</h1>
  <button id="btn-new">+ 新建</button>
  <button id="btn-save" title="把内存中的修改立即写入磁盘(不提交版本)">💾 保存</button>
  <button id="btn-revision">📷 存版本</button>
  <button id="btn-log">🕘 历史/恢复</button>
  <button id="btn-theme" title="切换主题">🌙</button>
  <span id="cur-file"></span>
  <span id="online"></span>
</header>
<main>
  <nav id="sidebar"><div id="file-list"></div></nav>
  <div id="editor-col">
    <div id="conn-banner">⚠ 连接已断开 —— 为避免内容分叉,编辑已锁定,正在自动重连…</div>
    <div id="toolbar"></div>
    <div id="editor"></div>
  </div>
  <div id="preview" class="markdown-body"></div>
</main>
<script>
window.addEventListener('error', function (e) {
  var d = document.createElement('pre')
  d.id = 'fatal-err'
  d.style.cssText = 'position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:9999;background:#5a1d1d;color:#ffb4b4;padding:8px 14px;border-radius:6px;max-width:80%;white-space:pre-wrap;font-size:12px'
  d.textContent = '致命错误: ' + ((e.error && e.error.stack) || e.message)
  document.body && document.body.appendChild(d)
})
</script>
<script src="/app.js?v=1795109091126"></script>
</body>
</html>
