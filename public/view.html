<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>mdwiki · 只读视图</title>
<link rel="stylesheet" href="/code-theme.css?v=1795162051983">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    --bg: #1e1e1e; --bg2: #252526; --bg3: #2d2d2d;
    --border: #333; --border2: #3e3e42;
    --fg: #cccccc; --fg-strong: #e8e8e8; --fg-dim: #8a8a8a;
    --accent: #7ec699; --link: #4daafc; --code-bg: #2b2b2b; --pre-bg: #1a1a1a;
    --th-bg: #252526; --scroll: #424242;
  }
  body.light {
    --bg: #ffffff; --bg2: #f8f8f8; --bg3: #e8e8e8;
    --border: #e2e2e2; --border2: #dcdcdc;
    --fg: #333333; --fg-strong: #1a1a1a; --fg-dim: #888888;
    --accent: #0a7d47; --link: #0451a5; --code-bg: #f1f1f1; --pre-bg: #f8f8f8;
    --th-bg: #f0f0f0; --scroll: #c1c1c1;
  }
  body { font-family: -apple-system, "PingFang SC", sans-serif; height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--fg); }
  header { display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: var(--bg2); border-bottom: 1px solid var(--border); }
  header h1 { font-size: 14px; color: var(--accent); }
  header .tag { font-size: 11px; color: var(--fg-dim); border: 1px solid var(--border2); border-radius: 8px; padding: 1px 8px; }
  #status { font-size: 12px; color: var(--fg-dim); margin-left: auto; }
  #btn-refresh { background: var(--bg3); color: var(--fg); border: 1px solid var(--border2); padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; }
  #btn-refresh:hover { background: var(--bg3); filter: brightness(1.2); }
  #btn-refresh:disabled { opacity: .5; cursor: wait; }
  main { flex: 1; display: flex; overflow: hidden; }
  #sidebar { width: 220px; background: var(--bg2); border-right: 1px solid var(--border); padding-top: 8px; overflow-y: auto; flex-shrink: 0; }
  #sidebar a { display: flex; align-items: center; gap: 5px; padding: 6px 12px; color: var(--fg); text-decoration: none; font-size: 13px; }
  #sidebar a:hover { background: var(--bg3); }
  #sidebar a.active { background: var(--bg3); color: var(--fg-strong); border-left: 3px solid var(--accent); }
  #sidebar a svg { width: 12px; height: 12px; flex-shrink: 0; color: var(--fg-dim); }
  #sidebar a .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #sidebar .dir { display: flex; align-items: center; gap: 4px; padding: 5px 12px; font-size: 12px; color: var(--fg-dim); cursor: pointer; user-select: none; -webkit-user-select: none; }
  #sidebar .dir:hover { background: var(--bg3); color: var(--fg); }
  #sidebar .dir .chev { width: 10px; font-size: 9px; flex-shrink: 0; }
  #sidebar .dir svg { width: 12px; height: 12px; flex-shrink: 0; color: #dcb67a; }
  body.light #sidebar .dir svg { color: #b8860b; }
  .f-json, .f-yaml, .f-yml, .f-js, .f-ts, .f-py, .f-css, .f-html, .f-sh { color: var(--link); }
  #content { flex: 1; overflow-y: auto; padding: 30px 44px; font-size: 15px; line-height: 1.75; color: var(--fg); max-width: 52rem; }
  #content h1 { font-size: 1.75em; color: var(--fg-strong); margin: 1em 0 .5em; padding-bottom: .3em; border-bottom: 1px solid var(--border2); }
  #content h2 { font-size: 1.4em; color: var(--fg-strong); margin: 1em 0 .5em; padding-bottom: .25em; border-bottom: 1px solid var(--border2); }
  #content h3 { font-size: 1.18em; color: var(--fg-strong); margin: 1em 0 .4em; }
  #content p { margin: .6em 0; }
  #content a { color: var(--link); }
  #content code { background: var(--code-bg); border-radius: 4px; padding: 2px 6px; font-size: .87em; font-family: "SF Mono", Menlo, Consolas, monospace; color: #ce9178; }
  body.light #content code { color: #a31515; }
  #content pre { background: var(--pre-bg); border: 1px solid var(--border); border-radius: 8px; padding: 13px 16px; overflow: auto; margin: .9em 0; }
  #content pre code { background: none; padding: 0; color: var(--fg); font-size: .87em; }
  #content blockquote { border-left: 4px solid var(--border2); padding: 6px 16px; margin: .8em 0; color: var(--fg-dim); }
  #content table { border-collapse: collapse; margin: .9em 0; }
  #content th, #content td { border: 1px solid var(--border2); padding: 6px 13px; }
  #content th { background: var(--th-bg); }
  #content img { max-width: 100%; }
  #empty { color: var(--fg-dim); padding: 60px; text-align: center; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body class="dark">
<header>
  <h1>mdwiki</h1><span class="tag">只读 · HEAD 快照</span>
  <span id="status">加载中…</span>
  <button id="btn-refresh">🔄 刷新快照</button>
</header>
<main>
  <nav id="sidebar"></nav>
  <div id="content"><div id="empty">从左侧选择文件,或先在编辑端「📷 存版本」产生提交</div></div>
</main>
<script src="/vendor.js?v=1795162051983"></script>
<script>
// 只读视图:全部数据来自 /view-api(读 worktree 的 HEAD 快照,与编辑端物理隔离)
const $sidebar = document.getElementById('sidebar')
const $content = document.getElementById('content')
const $status = document.getElementById('status')
const $btn = document.getElementById('btn-refresh')
const current = () => decodeURIComponent(location.hash.slice(1))

// 侧栏图标与编辑页同款(file-lines / folder / folder-open)
const ICONS = {
  file: 'M0 64C0 28.7 28.7 0 64 0L213.5 0c17 0 33.3 6.7 45.3 18.7L365.3 125.3c12 12 18.7 28.3 18.7 45.3L384 448c0 35.3-28.7 64-64 64L64 512c-35.3 0-64-28.7-64-64L0 64zm208-5.5l0 93.5c0 13.3 10.7 24 24 24L325.5 176 208 58.5zM120 256c-13.3 0-24 10.7-24 24s10.7 24 24 24l144 0c13.3 0 24-10.7 24-24s-10.7-24-24-24l-144 0zm0 96c-13.3 0-24 10.7-24 24s10.7 24 24 24l144 0c13.3 0 24-10.7 24-24s-10.7-24-24-24l-144 0z',
  folder: 'M64 448l384 0c35.3 0 64-28.7 64-64l0-240c0-35.3-28.7-64-64-64L298.7 80c-6.9 0-13.7-2.2-19.2-6.4L241.1 44.8C230 36.5 216.5 32 202.7 32L64 32C28.7 32 0 60.7 0 96L0 384c0 35.3 28.7 64 64 64z',
  folderOpen: 'M56 225.6L32.4 296.2 32.4 96c0-35.3 28.7-64 64-64l138.7 0c13.8 0 27.3 4.5 38.4 12.8l38.4 28.8c5.5 4.2 12.3 6.4 19.2 6.4l117.3 0c35.3 0 64 28.7 64 64l0 16-365.4 0c-41.3 0-78 26.4-91.1 65.6zM477.8 448L99 448c-32.8 0-55.9-32.1-45.5-63.2l48-144C108 221.2 126.4 208 147 208l378.8 0c32.8 0 55.9 32.1 45.5 63.2l-48 144c-6.5 19.6-24.9 32.8-45.5 32.8z',
}
const svgIcon = (d, vb = '0 0 384 512') => `<svg viewBox="${vb}" fill="currentColor"><path d="${d}"/></svg>`
const closedDirs = new Set()   // 折叠状态(目录完整路径),默认全部展开

async function loadStatus() {
  try {
    const s = (await (await fetch('/view-api/status')).json())
    if (s.ok === true) {
      $status.textContent = `HEAD ${s.head} · 同步于 ${new Date(s.syncedAt).toLocaleTimeString('zh-CN')}${s.trigger ? ' (' + s.trigger + ')' : ''}`
      // 工作区有未提交改动时明确提示:只读视图只反映 HEAD,否则会以为文件/目录消失
      if (s.pending > 0) {
        const hint = document.createElement('span')
        hint.style.cssText = 'color:#e8b339;margin-left:8px'
        hint.textContent = `⚠ ${s.pending} 项未提交(编辑端「📷 存版本」后才可见)`
        $status.appendChild(hint)
      }
    }
    else if (s.ok === false) $status.textContent = '同步失败: ' + (s.error || '')
    else $status.textContent = '尚未同步'
  } catch { $status.textContent = '服务不可达' }
}

// 平铺路径 → 目录树(目录优先、文件在后,各自按名称排序)
function buildTree(files) {
  const root = { dirs: new Map(), files: [] }
  for (const full of files) {
    const segs = full.split('/')
    let node = root
    for (const s of segs.slice(0, -1)) {
      if (!node.dirs.has(s)) node.dirs.set(s, { dirs: new Map(), files: [] })
      node = node.dirs.get(s)
    }
    node.files.push({ name: segs[segs.length - 1], full })
  }
  return root
}

function renderTree(node, depth, prefix, frag) {
  const byName = (a, b) => String(a).localeCompare(String(b), 'zh-Hans-CN')
  for (const k of [...node.dirs.keys()].sort(byName)) {
    const full = prefix ? prefix + '/' + k : k
    const open = !closedDirs.has(full)
    const d = document.createElement('div')
    d.className = 'dir'
    d.style.paddingLeft = (10 + depth * 13) + 'px'
    d.title = full
    d.innerHTML = `<span class="chev">${open ? '▾' : '▸'}</span>`
      + svgIcon(open ? ICONS.folderOpen : ICONS.folder, '0 0 512 512') + '<span>' + k + '</span>'
    d.onclick = () => { open ? closedDirs.add(full) : closedDirs.delete(full); loadTree() }
    frag.appendChild(d)
    if (open) renderTree(node.dirs.get(k), depth + 1, full, frag)
  }
  for (const f of [...node.files].sort((a, b) => byName(a.name, b.name))) {
    const a = document.createElement('a')
    a.href = '#' + encodeURIComponent(f.full)
    a.style.paddingLeft = (26 + depth * 13) + 'px'
    a.title = f.full
    const ext = 'f-' + (f.full.match(/\.([a-z0-9]+)$/i)?.[1] || 'md').toLowerCase()
    a.innerHTML = svgIcon(ICONS.file) + '<span class="name ' + ext + '">' + f.name + '</span>'
    if (f.full === current()) a.classList.add('active')
    frag.appendChild(a)
  }
}

async function loadTree() {
  try {
    const r = (await (await fetch('/view-api/files')).json())
    $sidebar.innerHTML = ''
    const files = r.files || []
    if (files.length) {
      const frag = document.createDocumentFragment()
      renderTree(buildTree(files), 0, '', frag)
      $sidebar.appendChild(frag)
    } else {
      $sidebar.innerHTML = '<div style="padding:12px;color:var(--fg-dim);font-size:12px">(无已提交文件)</div>'
    }
  } catch (e) { $sidebar.innerHTML = '<div style="padding:12px;color:#e0533d;font-size:12px">加载失败</div>' }
}

async function loadFile() {
  const f = current()
  if (!f) return
  try {
    const resp = await fetch('/view-api/content?path=' + encodeURIComponent(f))
    if (!resp.ok) throw new Error('HEAD 快照中没有这个文件(可能未提交或已删除)')
    const text = await resp.text()
    if (f.endsWith('.md')) {
      $content.innerHTML = DOMPurify.sanitize(marked.parse(text, { gfm: true, breaks: true }))
      highlightCode($content)
    } else {
      const esc = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      const lang = (f.match(/\.([a-z0-9]+)$/i)?.[1] || '').replace('yml', 'yaml')
      $content.innerHTML = `<pre><code class="language-${lang}">${esc}</code></pre>`
      highlightCode($content)
    }
    document.title = f.split('/').pop() + ' · mdwiki 只读'
  } catch (e) {
    $content.innerHTML = '<div id="empty">' + (e.message || '读取失败') + ': ' + f + '</div>'
  }
}

// 高亮库缺失要显式报错,别静默退化成一片无色的代码块(曾因此长期看不出问题)
function highlightCode(root) {
  if (typeof hljs === 'undefined') {
    console.error('highlight.js 未加载:检查 /vendor.js')
    $status.textContent = '⚠ 代码高亮库未加载'
    return
  }
  root.querySelectorAll('pre code').forEach(el => { try { hljs.highlightElement(el) } catch {} })
}

function refreshAll() { loadTree(); loadFile(); loadStatus() }

// 有人存版本时自动刷新(服务端已把 worktree 跳到新 HEAD),不用每次手点「刷新快照」
{
  const es = new EventSource('/api/events')
  es.onmessage = (ev) => {
    try { if (JSON.parse(ev.data).type === 'tree') refreshAll() } catch {}
  }
}

$btn.onclick = async () => {
  $btn.disabled = true; $btn.textContent = '⏳ 同步中…'
  try { await fetch('/view-api/refresh', { method: 'POST' }) } catch {}
  refreshAll()
  $btn.disabled = false; $btn.textContent = '🔄 刷新快照'
}

window.addEventListener('hashchange', () => { loadTree(); loadFile() })
// 60 秒自动对表(与服务器端定时同步同节奏;本地只重取数据,同步动作在服务端)
setInterval(refreshAll, 60 * 1000)

refreshAll()
</script>
</body>
</html>
